name: "Install zig"
description: "Downloads and extracts zig compiler"

runs:
  using: "composite"
  steps:
    - name: Install zig 0.15.2
      run: |
        set -euo pipefail
        ZIG_VERSION="0.15.2"

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            ZIG_TRIPLE="x86_64-linux"
            ;;
          Linux-ARM64)
            ZIG_TRIPLE="aarch64-linux"
            ;;
          macOS-X64)
            ZIG_TRIPLE="x86_64-macos"
            ;;
          macOS-ARM64)
            ZIG_TRIPLE="aarch64-macos"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        ARCHIVE="zig-${ZIG_TRIPLE}-${ZIG_VERSION}.tar.xz"
        curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/${ARCHIVE}" | tar -xJ
        echo "${GITHUB_WORKSPACE}/zig-${ZIG_TRIPLE}-${ZIG_VERSION}" >> "$GITHUB_PATH"
      shell: bash
